[metadata]
name = blue-whale-agent-worker
version = 0.1.0

[options]
packages = find:
package_dir =
    = src
python_requires = >=3.10
install_requires =
    pydantic-ai-slim==2.9.0

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    blue-whale-agent-worker = blue_whale_agent_worker.__main__:main
