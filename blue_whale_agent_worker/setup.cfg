[metadata]
name = blue-whale-agent-worker
version = 0.1.0

[options]
packages = find:
package_dir =
    = src
python_requires = >=3.10
install_requires =
    pydantic-ai-slim==2.9.0

[options.extras_require]
# 测试依赖：python3 -m venv .venv && .venv/bin/pip install -e ".[test]"
test =
    jsonschema==4.23.0
    pytest==8.3.5

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    blue-whale-agent-worker = blue_whale_agent_worker.__main__:main
