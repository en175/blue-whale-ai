services:
  blue-whale-api:
    build: .
    image: blue-whale-api:${NEW_API_IMAGE_TAG:-latest}
    container_name: blue-whale-api
    restart: unless-stopped
    ports:
      - "3001:3000"
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
      - CRITICAL_RATE_LIMIT=2000
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    command: --log-dir /app/logs
