server:
  port: 8081

spring:
  application:
    name: blue-whale-user
  cloud:
    nacos:
      # 本地 Docker Compose 默认连容器服务名 nacos:8848；远端用 NACOS_SERVER_ADDR 覆盖
      server-addr: ${NACOS_SERVER_ADDR:nacos:8848}
      discovery:
        enabled: true
        namespace: ${NACOS_NAMESPACE:}

  web:
    encoding:
      charset: UTF-8
      force: true

  autoconfigure:
    exclude:
      - com.baomidou.dynamic.datasource.spring.boot.autoconfigure.DynamicDataSourceAutoConfiguration
      - org.redisson.spring.starter.RedissonAutoConfiguration

  datasource:
    # 本地默认连容器服务名 mysql:3306；远端用 MYSQL_HOST/MYSQL_PORT/MYSQL_DB 覆盖
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DB:blue_whale}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:blue_whale}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jackson:
    property-naming-strategy: SNAKE_CASE

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

  redis:
    # 本地默认连容器服务名 redis:6379（无密码）；远端用 REDIS_HOST/REDIS_PORT/REDIS_PASSWORD 覆盖
    host: ${REDIS_HOST:redis}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: 0

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: "${JWT_SECRET:blue-whale-dev-secret-key-at-least-256-bits!!}"
  expiration: 604800

sms:
  # 本地默认 console（控制台打印验证码，无需真实短信）；远端用 SMS_PROVIDER=volcengine 覆盖
  provider: ${SMS_PROVIDER:console}

# 火山引擎短信（切换 provider=volcengine 后生效，凭据必须由 env 注入，不入库）
volcengine:
  sms:
    access-key-id: ${VOLC_SMS_ACCESS_KEY_ID:}
    secret-access-key: ${VOLC_SMS_SECRET_ACCESS_KEY:}
    sms-account: ${VOLC_SMS_ACCOUNT:}
    sign: ${VOLC_SMS_SIGN:玄浮科技}
    template-id: ${VOLC_SMS_TEMPLATE_ID:}
