server:
  port: 8080

spring:
  web:
    encoding:
      charset: UTF-8
      force: true

  autoconfigure:
    exclude:
      - com.baomidou.dynamic.datasource.spring.boot.autoconfigure.DynamicDataSourceAutoConfiguration

  datasource:
    url: jdbc:mysql://110.42.233.109:3306/blue_whale?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: root
    password: root1024
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

