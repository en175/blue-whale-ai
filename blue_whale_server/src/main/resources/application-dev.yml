# 开发环境数据源。本地 MySQL 地址/账号/密码按实际调整。
# 注意：脚手架不建业务表；运行 spring-boot:run 需本地可连通的 MySQL（测试不依赖数据库）。
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/blue_whale?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
