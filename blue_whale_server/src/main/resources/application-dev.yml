# 开发环境 profile（进仓共享）。完整配置，无 application.yml 依赖。
# 激活方式：IDE Run Config → Active profiles 填 dev；或启动参数 --spring.profiles.active=dev
# ARK key 本地写死在 volcengine.ark.api-key（不走环境变量，方便测试）。
# datasource 默认连本地 Docker MySQL（root/root），可 export 覆盖。
# 业务接口需连通 MySQL + 已执行 resources/schema.sql 建表；裸 GET /health 不依赖数据库（HikariCP 懒建池）。

server:
  port: 8000

spring:
  application:
    name: blue-whale-agent
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
    # 前后端 JSON 字段统一 snake_case，对齐 PRD
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/blue_whale?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    # 不用 StdOutImpl：它会绕过日志级别、直接 System.out 打 SQL/参数/结果，刷屏。
    # SQL 日志改由 Slf4j + logging.level.com.bluewhale.agent.mapper 控制级别；要看 SQL 时设 debug。
    # log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

volcengine:
  ark:
    # 火山方舟 Ark：单一 Bearer API Key，文生图 + 图生视频共用；model 由前端请求带入
    base-url: https://ark.cn-beijing.volces.com/api/v3
    api-key: ark-90702f0d-327b-4d76-890c-7dc81efd5721-e0494
springdoc:
  api-docs:
    # 2.8.14+ 默认关闭，显式开启供 Apifox 从 /v3/api-docs 拉取 spec 同步接口
    enabled: true
    path: /v3/api-docs

logging:
  level:
    com.bluewhale.agent: debug
    # MyBatis mapper 的 SQL 日志默认不打（避免刷屏）；调试 SQL 时改 debug。
    com.bluewhale.agent.mapper: warn
