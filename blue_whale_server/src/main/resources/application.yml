server:
  port: 8000

spring:
  application:
    name: blue-whale-agent
  profiles:
    active: dev
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
    # 前后端 JSON 字段统一 snake_case，对齐 PRD
    property-naming-strategy: SNAKE_CASE

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

volcengine:
  ark:
    # 火山方舟 Ark：单一 Bearer API Key，文生图(Seedream) + 图文生视频(Seedance 2.0) 共用
    base-url: https://ark.cn-beijing.volces.com/api/v3
    api-key: ${ARK_API_KEY:}
    image-model: doubao-seedream-5-0-lite-250723
    video-model: doubao-seedance-2-0-260128

springdoc:
  api-docs:
    # 2.8.14+ 默认关闭，显式开启供 Apifox 从 /v3/api-docs 拉取 spec 同步接口
    enabled: true
    path: /v3/api-docs
