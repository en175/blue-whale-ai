server:
  port: 8686
spring:
  application:
    name: blue-whale-gateway
  profiles:
    active: blue-whale-dev
  cloud:
    nacos:
      server-addr: 192.168.10.81:8848
      discovery:
        # namespace 用 Nacos namespace ID（UUID），非名字；与 agent-service 一致才能发现彼此
        namespace: 1bb06cf5-c1ad-4054-b022-49358a2f49aa
      config:
        namespace: 1bb06cf5-c1ad-4054-b022-49358a2f49aa
        file-extension: yml
        group: BLUE_WHALE
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: blue-whale-agent
          uri: lb://blue-whale-agent
          predicates:
            - Path=/api/agent/**
          filters:
            - StripPrefix=2
    loadbalancer:
      retry:
        enabled: true
sentinel:
  nacos:
    namespace: ${spring.profiles.active}
    serverAddr: ${spring.cloud.nacos.server-addr}
    groupId: SENTINEL_GROUP
    dataId:
      flowPostfix: -flow-rules
      degradePostfix: -degrade-rules
      gwApiPostfix: -gw-api-group-rules
      gwFlowPostfix: -gw-flow-rules