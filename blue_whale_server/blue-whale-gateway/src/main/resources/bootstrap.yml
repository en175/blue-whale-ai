server:
  port: 8686
spring:
  application:
    name: blue-whale-gateway
  profiles:
    active: blue-whale-dev
  cloud:
    nacos:
      # 本地 Docker Compose 默认连容器服务名 nacos:8848；远端用 NACOS_SERVER_ADDR 覆盖
      server-addr: ${NACOS_SERVER_ADDR:nacos:8848}
      discovery:
        # namespace 用 Nacos namespace ID（UUID）或 public 空 namespace（本地默认空）；与 agent-service 一致才能发现彼此
        namespace: ${NACOS_NAMESPACE:}
      config:
        namespace: ${NACOS_NAMESPACE:}
        file-extension: yml
        group: BLUE_WHALE
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            exposedHeaders: "Authorization"
            allowCredentials: true
      discovery:
        locator:
          enabled: true
      routes:
        - id: blue-whale-agent
          uri: lb://blue-whale-agent
          predicates:
            # agent-service 端点前缀：/api/agent/**（skill/template）、/api/projects/**（project/snapshot/events）、
            # /api/canvases/**（CanvasController，画布读写）、
            # /api/jobs/**、/api/generation/**、/api/assets/**、/api/webhooks/**
            - Path=/api/agent/**,/api/projects/**,/api/canvases/**,/api/jobs/**,/api/generation/**,/api/assets/**,/api/webhooks/**
        - id: blue-whale-user
          uri: lb://blue-whale-user
          predicates:
            - Path=/api/auth/**, /api/me, /api/user/**
    loadbalancer:
      retry:
        enabled: true
sentinel:
  nacos:
    namespace: ${spring.profiles.active}
    serverAddr: ${spring.cloud.nacos.server-addr}
    groupId: SENTINEL_GROUP
    dataId:
      flowPostfix: -flow-rules
      degradePostfix: -degrade-rules
      gwApiPostfix: -gw-api-group-rules
      gwFlowPostfix: -gw-flow-rules