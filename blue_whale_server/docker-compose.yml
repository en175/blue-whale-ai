services:
  blue-whale-user:
    build:
      context: .
      dockerfile: blue-whale-user/blue-whale-user-service/Dockerfile
    container_name: blue-whale-user
    ports:
      - "8081:8081"
    restart: unless-stopped

  blue-whale-gateway:
    build:
      context: .
      dockerfile: blue-whale-gateway/Dockerfile
    container_name: blue-whale-gateway
    ports:
      - "8686:8686"
    restart: unless-stopped
    depends_on:
      - blue-whale-user
