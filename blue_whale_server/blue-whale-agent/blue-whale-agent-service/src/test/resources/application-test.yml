# H2 集成测试 profile：MODE=MySQL，内存库，自动跑 schema-h2.sql。
# 覆盖事务一致性、游标单调连续、Snapshot 一致性、断线重放、CURSOR_EXPIRED、去重。
server:
  port: 0

spring:
  datasource:
    dynamic:
      primary: master
      strict: false
      datasource:
        master:
          url: jdbc:h2:mem:blue_whale_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
          username: sa
          password:
          driver-class-name: org.h2.Driver
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema-h2.sql
  jackson:
    property-naming-strategy: SNAKE_CASE

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

oss:
  volcengine:
    access-key: test
    secret-key: test
    bucket-name: test
    domain: https://test.tos.example.com

volcengine:
  ark:
    base-url: http://localhost:0
    api-key: test-key
