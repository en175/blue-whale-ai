server:
  port: 8082

spring:
  application:
    name: blue-whale-agent
  profiles:
    active: blue-whale-dev
  cloud:
    nacos:
      # 本地 Docker Compose 默认连容器服务名 nacos:8848；远端用 NACOS_SERVER_ADDR 覆盖
      server-addr: ${NACOS_SERVER_ADDR:nacos:8848}
      discovery:
        register-enabled: true
        # namespace 必须用 Nacos 的 namespace ID（UUID）或 public 空 namespace（本地默认空）；
        # 用名字会注册到 console 看不见的隐式命名空间
        namespace: ${NACOS_NAMESPACE:}
        timeout: 10000
  datasource:
    dynamic:
      primary: master
      strict: false
      datasource:
        master:
          # 本地默认连容器服务名 mysql:3306；远端用 MYSQL_HOST/MYSQL_PORT/MYSQL_DB 覆盖
          url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DB:blue_whale}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
          username: ${MYSQL_USER:root}
          password: ${MYSQL_PASSWORD:blue_whale}
          driver-class-name: com.mysql.cj.jdbc.Driver
          type: com.zaxxer.hikari.HikariDataSource
          hikari:
            minimum-idle: 2
            maximum-pool-size: 10
            connection-timeout: 20000
            idle-timeout: 300000
            max-lifetime: 1200000
  redis:
    # 本地默认连容器服务名 redis:6379（无密码）；远端用 REDIS_HOST/REDIS_PORT/REDIS_PASSWORD 覆盖
    host: ${REDIS_HOST:redis}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: 0
  jackson:
    # 前端字段全 snake_case，必须 SNAKE_CASE 才能映射到后端 camelCase（model_id→modelId）。
    # MybatisJacksonConfig 复用此 ObjectMapper 给 JacksonTypeHandler，DB 的 JSON 列也是 snake_case。
    property-naming-strategy: SNAKE_CASE

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.blue.whale.agent.**.entity
  configuration:
    map-underscore-to-camel-case: true
    # 默认走 slf4j，不用 StdOutImpl（它会把每条 SQL 打到 stdout 刷屏）；需要看 SQL 时取消下行注释
    # log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

oss:
  volcengine:
    access-key: ${TOS_ACCESS_KEY}
    secret-key: ${TOS_SECRET_KEY}
    bucket-name: ${TOS_BUCKET_NAME}
    domain: ${TOS_DOMAIN:https://sweet-oa.tos-cn-beijing.volces.com}

logging:
  level:
    com.blue.whale.agent.mapper: info

blue-whale:
  generation:
    # disabled | openai-tos | fake（fake 仅限非生产，需同时显式置 fake-allowed=true）
    mode: ${GENERATION_MODE:disabled}
    fake-allowed: ${GENERATION_FAKE_ALLOWED:false}
    # 受控真实图片验收（IK1NS3）：仅 mode=openai-tos 的非生产环境可显式置 true，
    # 以非生产确定性证据源替换 fail-closed 占位证据源；生产 profile 拒绝该组合
    acceptance-allowed: ${GENERATION_ACCEPTANCE_ALLOWED:false}
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      model: ${OPENAI_IMAGE_MODEL:gpt-image-2}
      max-image-bytes: ${OPENAI_IMAGE_MAX_BYTES:20971520}
    tos:
      access-key: ${GENERATION_TOS_ACCESS_KEY:}
      secret-key: ${GENERATION_TOS_SECRET_KEY:}
      region: ${GENERATION_TOS_REGION:}
      endpoint: ${GENERATION_TOS_ENDPOINT:}
      bucket: ${GENERATION_TOS_BUCKET:}
      prefix: ${GENERATION_TOS_PREFIX:generation}
      signed-url-ttl-seconds: ${GENERATION_TOS_SIGNED_URL_TTL_SECONDS:300}
      max-read-bytes: ${GENERATION_TOS_MAX_READ_BYTES:20971520}
      max-video-bytes: ${GENERATION_TOS_MAX_VIDEO_BYTES:209715200}
    seedance:
      account-id: ${SEEDANCE_ACCOUNT_ID:default}
      callback-base-url: ${SEEDANCE_CALLBACK_BASE_URL:}
      initial-poll-seconds: 5
      max-poll-seconds: 30
      allowed-result-host-suffixes: ${SEEDANCE_ALLOWED_RESULT_HOST_SUFFIXES:volces.com}
    agent-plan:
      # 本地磁盘生成存储根目录（Docker 卷挂载，重启不丢）；仅 mode=agent-plan 时由 LocalDiskGenerationStorage 使用
      storage-root: ${GENERATION_LOCAL_STORAGE_ROOT:/var/lib/blue-whale/generation}
    worker-scheduled: ${GENERATION_WORKER_SCHEDULED:true}
  project-events:
    redis-enabled: true
    channel: blue-whale:project-events
  # ContentReview 策略版本（ADR-0029）：本地非生产固定确定性策略；生产由专门 issue 接入真实供应商
  content-review:
    policy-version: ${CONTENT_REVIEW_POLICY_VERSION:local-fake-v1}
  agent-orchestrator:
    engine: ${AGENT_ORCHESTRATOR_ENGINE:pydantic-ai}
    engine-version: ${AGENT_ORCHESTRATOR_ENGINE_VERSION:2.9.0}
    adapter-schema-version: ${AGENT_ORCHESTRATOR_SCHEMA_VERSION:1}
  runtime-bundle:
    # 运行钉版强制开关（IK2D8J）：默认开启与 @Value 缺省一致；隔离验收栈无激活
    # BundleVersion 种子（与 test profile 一致），经 compose 显式置 false。
    enforcement-enabled: ${RUNTIME_BUNDLE_ENFORCEMENT_ENABLED:true}

# 火山方舟 Ark：图片/视频生成。api-key 必填，否则 ArkService bean 不创建、生成接口报配置缺失
volcengine:
  ark:
    base-url: ${ARK_BASE_URL:https://ark.cn-beijing.volces.com/api/v3}
    api-key: ${ARK_API_KEY:}
