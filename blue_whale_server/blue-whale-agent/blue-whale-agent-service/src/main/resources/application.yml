server:
  port: 8082

spring:
  application:
    name: blue-whale-agent
  profiles:
    active: blue-whale-dev
  cloud:
    nacos:
      server-addr: 115.190.244.91:8848
      discovery:
        register-enabled: true
        # namespace 必须用 Nacos 的 namespace ID（UUID），用名字会注册到 console 看不见的隐式命名空间
        # 本地开发传 NACOS_NAMESPACE=<隔离 namespace ID> 注册到独立 namespace，避免串线上流量
        namespace: ${NACOS_NAMESPACE:1bb06cf5-c1ad-4054-b022-49358a2f49aa}
        timeout: 10000
      config:
        server-addr: 115.190.244.91:8848
        namespace: ${NACOS_NAMESPACE:1bb06cf5-c1ad-4054-b022-49358a2f49aa}
        file-extension: yml
        group: BLUE_WHALE


  datasource:
    dynamic:
      primary: master
      strict: false
      datasource:
        master:
          url: jdbc:mysql://115.190.244.91:3306/blue_whale?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
          username: root
          password: weitian1024
          driver-class-name: com.mysql.cj.jdbc.Driver
          type: com.zaxxer.hikari.HikariDataSource
          hikari:
            minimum-idle: 2
            maximum-pool-size: 10
            connection-timeout: 20000
            idle-timeout: 300000
            max-lifetime: 1200000
  redis:
    host: 115.190.244.91
    port: 6379
    password: weitian1024
    database: 0
  servlet:
    multipart:
      # 素材上传上限：图片≤2MB / 视频≤50MB（与 AssetService 校验对齐），放开 Spring/Tomcat 默认 1MB 限制
      max-file-size: 50MB
      max-request-size: 55MB
  # HTTP 对外 JSON 默认 camelCase（合规 CLAUDE.md 后端规范）。
  # DB JSON 列的 snake↔camel 映射由 MybatisJacksonConfig 注入独立 SNAKE_CASE ObjectMapper 给
  # JacksonTypeHandler 处理，与 HTTP 隔离；普通列靠 mybatis-plus map-underscore-to-camel-case（见下）。

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.blue.whale.agent.**.entity
  configuration:
    map-underscore-to-camel-case: true
    # 默认走 slf4j，不用 StdOutImpl（它会把每条 SQL 打到 stdout 刷屏）；需要看 SQL 时取消下行注释
    # log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

oss:
  tos:
    access-key: AKLTYjI2ZjM3NDU1NTBiNDQwMDkwNjFhZmQxOWVhOGYyODg
    secret-key: WVdVMU9UTmhaREppTWpSa05EWmlOVGxoT1RNMFlqVTVOR00xWkRKalpqaw==
    bucket-name: bluewhale-assets

logging:
  level:
    com.blue.whale.agent.mapper: info

# 火山方舟 Ark：图片/视频生成。api-key 必填，否则 ArkService bean 不创建、生成接口报配置缺失
