server:
  port: 8082

spring:
  application:
    name: blue-whale-agent
  profiles:
    active: blue-whale-dev
  cloud:
    nacos:
      server-addr: 115.190.244.91:8848
      discovery:
        register-enabled: true
        # namespace 必须用 Nacos 的 namespace ID（UUID），用名字会注册到 console 看不见的隐式命名空间
        namespace: 1bb06cf5-c1ad-4054-b022-49358a2f49aa
        timeout: 10000
  datasource:
    dynamic:
      primary: master
      strict: false
      datasource:
        master:
          url: jdbc:mysql://115.190.244.91:3306/blue_whale?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
          username: root
          password: weitian1024
          driver-class-name: com.mysql.cj.jdbc.Driver
          type: com.zaxxer.hikari.HikariDataSource
          hikari:
            minimum-idle: 2
            maximum-pool-size: 10
            connection-timeout: 20000
            idle-timeout: 300000
            max-lifetime: 1200000
  redis:
    host: 115.190.244.91
    port: 6379
    password: weitian1024
    database: 0

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.blue.whale.agent.**.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.blue.whale.agent.mapper: debug
