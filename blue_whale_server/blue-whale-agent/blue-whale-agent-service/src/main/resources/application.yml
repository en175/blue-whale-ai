  ark:
    base-url: https://ark.cn-beijing.volces.com/api/v3
    api-key: ark-90702f0d-327b-4d76-890c-7dc81efd5721-e0494

# 模板标签：原 TemplateTagEnum 枚举迁为配置项，增删标签改此处即可，无需改代码
# tagCode 值须与 DB template_card.tag_code 现有数据保持一致
bluewhale:
  template:
    tags:
      - tag-code: marketing
        label: 营销视频
        sort-order: 0
      - tag-code: short
        label: 微短片
        sort-order: 1
      - tag-code: replicate
        label: 视频复刻
        sort-order: 2
      - tag-code: social
        label: 社媒视频
        sort-order: 3
      - tag-code: image
        label: 图片设计
        sort-order: 4
