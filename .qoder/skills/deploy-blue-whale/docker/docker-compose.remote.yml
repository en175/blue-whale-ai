# 远程部署 compose（3 后端，前端不在本流程）。scp 到 /opt/blue-whale/docker-compose.yml。
# 全部走网关：gateway(8686) 对外，user/agent 内部，由 gateway 经 Nacos 发现路由。
# 镜像在远程由 remote-build.sh 用 jars/ 里的 jar build 出（blue-whale-<svc>:latest）。
#
# 首次部署前，/opt/blue-whale/.env 含 agent 的 OSS 凭证：
#   TOS_ACCESS_KEY=...
#   TOS_SECRET_KEY=...
#   TOS_BUCKET_NAME=...
services:
  blue-whale-gateway:
    image: blue-whale-gateway:latest
    container_name: blue-whale-gateway
    ports:
      - "8686:8686"
    restart: unless-stopped

  blue-whale-user:
    image: blue-whale-user:latest
    container_name: blue-whale-user
    restart: unless-stopped

  blue-whale-agent:
    image: blue-whale-agent:latest
    container_name: blue-whale-agent
    env_file:
      - .env
    restart: unless-stopped

  blue-whale-web:
    image: blue-whale-web:latest
    container_name: blue-whale-web
    environment:
      - GATEWAY_URL=http://blue-whale-gateway:8686
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - blue-whale-gateway
