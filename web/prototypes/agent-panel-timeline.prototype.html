  solutionDoc() {
    return { title: '方案卡 · 晴日北欧海边小镇', prompt: SOLUTION.direction, md: [['h2', '方案卡'], ['table', [['媒介', SOLUTION.media], ['模型', SOLUTION.model], ['参数', SOLUTION.params.join(' · ')], ['状态', state.card?.confirmed ? '已确认 21:37' : '等你拍板']]], ['h3', '目标'], ['p2', SOLUTION.goal], ['h3', '方向'], ['p', null], ['h3', '你要求的'], ['ul', SOLUTION.constraints], ['h3', '我替你定的'], ['ol', SOLUTION.assumptions]] };
  },
  /** 点「打开查看」：面板内弹一层，把卡渲染成 md（真前端直接复用 AgentPanel 里现成的 Markdown 组件）。 */
  sheet(P) {
    const panel = document.getElementById('panel');
    const body = $('div', { class: 'f-md' });
    for (const [tag, v] of P.md) {
      if (tag === 'table') body.append($('table', {}, ...v.map(([k, x]) => $('tr', {}, $('td', { class: 'dim' }, k), $('td', {}, x)))));
      else if (tag === 'ul') body.append($('ul', {}, ...v.map(x => $('li', {}, P.assets ? F.rich(x, P.assets) : x))));
      else if (tag === 'p') body.append($('p', {}, P.assets ? F.rich(P.prompt, P.assets) : P.prompt));
      else if (tag === 'p2') body.append($('p', {}, v));
      else if (tag === 'ol') body.append($('ol', {}, ...v.map(x => $('li', {}, x))));
      else body.append($(tag, {}, v));
    }
    const ov = $('div', { class: 'f-ov' },
      $('div', { class: 'f-ov-hd' }, $('b', {}, `${P.title}.md`), $('span', { style: 'margin-left:auto;display:flex;gap:10px;align-items:center' }, $('button', { class: 'btn', style: 'font-size:11px;padding:2px 8px' }, '⤓ 下载 .md'), $('button', { onclick: () => ov.remove() }, '✕'))),
      body);
    panel.append(ov);
  },
  qstyle: 1,
  /** 追问保持文字、不点选（产品拍板）。三种排版：原版就是模型写的 markdown 原样；一、二只动样式不动字。 */
  form(qs) {
    const st = F.qstyle;
    const recOf = q => (q.multi ? q.rec : [q.rec]);
    const recLabel = q => recOf(q).map(k => `${k}（${labelOf(q, k)}）`).join('、');
    if (st === 0) {
      const lines = qs.map((q, n) => [`❓ Q${n + 1} — ${q.title}：${q.ask}`, '', ...q.opts.map(([k, l, d]) => `${k}. ${l}：${d}`), `➡️ 推荐 ${recLabel(q)}：${q.why}`].join('\n'));
      return $('div', { class: 'say f-q0' }, lines.join('\n\n'));
    }
    return $('div', { class: `f-qt s${st}` }, ...qs.map((q, n) => $('div', { class: 'f-qi' },
      $('div', { class: 'h' }, $('span', { class: 'n' }, `Q${n + 1}`), $('b', {}, q.title), $('span', { class: 'ask' }, q.ask), q.multi ? $('span', { class: 'multi' }, '可多选') : null),
      $('div', { class: 'opts' }, ...q.opts.map(([k, l, d]) => $('div', { class: `opt ${recOf(q).includes(k) ? 'rec' : ''}` }, $('span', { class: 'k' }, k), $('span', {}, $('b', {}, l), $('span', { class: 'd' }, `：${d}`))))),
      $('div', { class: 'why' }, $('span', { class: 'lb' }, `推荐 ${recLabel(q)}`), q.why))),
      $('div', { class: 'tip' }, '直接回我，比如「都按推荐」或「Q1 选 B，其他按推荐」'));
  },
  paintDraft() {
    const el = F.draftEl;
    if (!el) return;
    if (!F.pending) { el.replaceChildren(); el.style.display = 'none'; return; }
    el.style.display = '';
    const chips = F.pending.map(q => {
      const picks = picksOf(q);
      const other = picks.includes('其他') ? `${state.other?.[q.id] || '…'}` : null;
      const named = picks.filter(k => k !== '其他');
      if (!named.length && other !== null) return $('span', { class: 'chip o' }, `${q.title}：${other}`);
      return $('span', { class: `chip ${other !== null ? 'o' : ''}` }, `${q.title} `, $('span', { class: 'dim' }, named.map(k => labelOf(q, k)).join(' + ') + (other !== null ? ` + ${other}` : '') || '不加'));
    });
    const changed = F.pending.filter(q => !sameSet(picksOf(q), q.multi ? q.rec : [q.rec])).length;
    el.replaceChildren($('span', { class: 'k' }, changed ? `要发的回答（改了 ${changed} 题）` : '要发的回答（都按推荐）'), ...chips, $('button', { class: 'btn primary send', style: 'padding:3px 10px' }, '发送'));
  },
  brief(confirmedAlready) {
    state.card ??= { confirmed: false, mode: null };
    if (confirmedAlready) state.card.confirmed = true;
    const box = $('div', { class: 'f-brief' });
    const paint = () => {
      const c = state.card;
      const acts = c.confirmed
        ? $('div', { class: 'f-acts' }, $('span', { style: 'color:var(--accent)' }, '● 已确认 · 21:37'), $('span', { class: 'sp' }), $('button', { class: 'btn', onclick: () => { c.confirmed = false; c.mode = 'alt'; paint(); } }, '换个思路'))
        : $('div', { class: 'f-acts' }, $('button', { class: 'btn primary', onclick: () => { c.confirmed = true; c.mode = null; paint(); } }, '确认，按这个写'), $('button', { class: `btn ${c.mode === 'alt' ? 'primary' : ''}`, onclick: () => { c.mode = c.mode === 'alt' ? null : 'alt'; paint(); } }, '换个思路'), $('button', { class: `btn ${c.mode === 'edit' ? 'primary' : ''}`, onclick: () => { c.mode = c.mode === 'edit' ? null : 'edit'; paint(); } }, '我来改'), $('span', { class: 'sp' }), '不确认就不会写卡');
      const extra = c.mode === 'alt'
        ? $('div', { class: 'f-alt' }, ['换个构图（黄昏对岸远眺）', '换个风格（地中海白墙蓝顶）', '换个模型（GPT Image 2）', '全部重来一版'].map(x => $('button', {}, x)))
        : c.mode === 'edit'
          ? $('div', { class: 'f-edit' }, $('div', { class: 'f-in', style: 'margin:0' }, $('input', { placeholder: '告诉我改哪里，比如「灯塔放右边，去掉小船」' }), $('button', { class: 'btn primary' }, '发送')))
          : null;
      box.replaceChildren(
        $('div', { class: 'band top' }, $('span', { class: 'kick' }, '方案卡', $('span', { class: 'st' }, c.confirmed ? '已确认' : '等你拍板'), $('button', { class: 'md', title: '点开查看 / 下载 .md', onclick: () => F.sheet(F.solutionDoc()) }, '▤ .md')), $('span', {}, $('b', {}, '媒介'), SOLUTION.media), $('span', {}, $('b', {}, '模型'), SOLUTION.model), $('span', {}, $('b', {}, '参数'), SOLUTION.params.join(' · '))),
        $('div', { class: 'in' },
          $('h3', {}, SOLUTION.goal),
          $('blockquote', {}, SOLUTION.direction),
          $('div', { class: 'grp' }, '你要求的（不会改）'),
          $('ul', {}, SOLUTION.constraints.filter(x => !SOLUTION.params.some(pp => x.startsWith(pp))).map(x => $('li', {}, x))),
          $('div', { class: 'grp' }, '我替你定的（不合适就说）'),
          $('ol', {}, SOLUTION.assumptions.map(a => $('li', {}, a)))),
        acts, ...(extra ? [extra] : []));
    };
    paint();
    return box;
  },
};

/* =============================== 启动 =============================== */
function renderNotes(v) {
  const n = v.notes;
  const sec = (title, items) => [$('h3', {}, title), $('ul', {}, items.map(i => $('li', {}, i)))];
  document.getElementById('notes').replaceChildren(
    $('span', { class: 'tag' }, '最终版'), $('h2', {}, v.name), $('div', {}, n.idea),
    ...sec('① 思考链路', n.chain), ...sec('② 追问选项', n.q), ...sec('③ 方案卡', n.card), ...sec('③b 提示词卡', n.gen), ...sec('④ 统计行', n.foot),
    $('h3', {}, '试一下'), $('ul', {}, $('li', {}, '点开「已处理」那行，再点阶段'), $('li', {}, '点选项；推荐项默认已选；「海面细节」是多选'), $('li', {}, '点「其他」写自己的；看输入框上方的草稿'), $('li', {}, '方案卡的 ▤ .md、提示词卡的「打开查看」'), $('li', {}, '底部「运行中」看最后一轮还在想的样子')));
}
function render() {
  clearTickers();
  document.getElementById('runToggle').classList.toggle('on', state.running);
  renderNotes(F);
  F.render(turnsForView());
}
document.getElementById('runToggle').onclick = () => { state.running = !state.running; render(); };
render();
</script>
