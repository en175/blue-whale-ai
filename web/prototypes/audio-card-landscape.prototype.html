<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PROTOTYPE · 画布音频成品卡（横版改版）</title>
<!--
  PROTOTYPE — 用完即删。给产品负责人确认音频成品卡横版改版的视觉效果（2026-09-20 三轮拍板版）。
  播放是模拟的（无真实音频）：playhead 走 15s 后停回开头。双击打开即可演示。
  交互：点击卡片选中浮出工具条，点击画布空白取消；波形可点击/拖拽 seek；置灰钮 hover 提示「即将上线」。
-->
<style>
  :root {
    --bg: #131313;
    --card: #1a1a1a;
    --well: #121212;
    --toolbar: #242424;
    --line: #2c2c2c;
    --text: #ffffff;
    --text2: #9a9a9a;
    --text3: #5f5f5f;
    --dim: rgba(255, 255, 255, .4);
    --playhead: #f0434a;
    --ok: #7be3a3;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    /* 点阵网格画布 */
    background-image: radial-gradient(rgba(255, 255, 255, .1) 1px, transparent 1.2px);
    background-size: 26px 26px;
    color: var(--text);
    font: 13px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    overflow: hidden;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  .num { font-variant-numeric: tabular-nums; }

  .stage {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    /* 卡片落在中央偏左 */
    padding-right: 18vw;
  }

  /* ---- 角落操作提示（非被评估设计） ---- */
  .hint {
    position: fixed;
    right: 18px;
    bottom: 14px;
    font-size: 11.5px;
    color: #565656;
    letter-spacing: .02em;
    user-select: none;
  }

  /* ---- 选中卡片后浮出的工具条 ---- */
  .wrap { width: 480px; position: relative; }
  .toolbar {
    position: absolute;
    bottom: calc(100% + 10px);
    left: 50%;
    transform: translate(-50%, 6px);
    display: flex;
    align-items: center;
    background: #1e1e1e; /* ADR-0100 浮层容器令牌 --color-bg-overlay */
    border: 1px solid #2c2c2c; /* --color-border-overlay */
    border-radius: 12px; /* 浮条档 --radius-lg（卡悬浮工具条家族统一 12px，非胶囊） */
    padding: 6px 10px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4); /* --shadow-overlay */
    opacity: 0;
    visibility: hidden;
    transition: opacity .18s ease, transform .18s ease, visibility .18s;
    white-space: nowrap;
    z-index: 10;
  }
  .wrap.selected .toolbar {
    opacity: 1;
    visibility: visible;
    transform: translate(-50%, 0);
  }
  .tb {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
    border-radius: 8px; /* 真实 toolBtn 为 8px 小圆角，非胶囊 */
    font-size: 12px; /* --font-size-sm */
    color: #ddd; /* 真实 toolBtn 前景色 */
    transition: background .12s, color .12s;
  }
  .tb svg { width: 14px; height: 14px; flex: none; }
  .tb:not(.disabled):hover { background: rgba(255, 255, 255, .08); color: #fff; }
  .tb.disabled {
    color: #666; /* 真实 aria-disabled 置灰值 */
    cursor: not-allowed;
  }
  .tb.disabled:active { transform: none; }
  .tb .tip {
    position: absolute;
    bottom: calc(100% + 10px);
    left: 50%;
    transform: translateX(-50%) translateY(2px);
    background: #0c0c0c;
    border: 1px solid rgba(255, 255, 255, .1);
    color: rgba(255, 255, 255, .85);
    font-size: 11px;
    line-height: 1;
    padding: 5px 9px;
    border-radius: 6px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .15s, transform .15s;
  }
  .tb.disabled:hover .tip {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  .sep {
    width: 1px;
    height: 18px;
    background: rgba(255, 255, 255, .14);
    margin: 0 6px;
    flex: none;
  }
  .tb.flash { animation: dlflash .8s ease; }
  @keyframes dlflash {
    0% { color: var(--ok); background: rgba(105, 219, 124, .16); }
    100% { color: #ddd; background: transparent; }
  }

  /* ---- 卡外标题行 ---- */
  .meta {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-bottom: 10px;
  }
  .meta svg { width: 15px; height: 15px; color: #7a7a7a; flex: none; }
  .meta .name { color: var(--text2); font-size: 12.5px; }
  .meta .dur { margin-left: auto; color: var(--text3); font-size: 12px; }

  /* ---- 音频成品卡 ---- */
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px;
    box-shadow: 0 20px 48px rgba(0, 0, 0, .4);
    transition: border-color .15s, box-shadow .15s;
    cursor: default;
  }
  .card:hover { border-color: #3c3c3c; }
  .wrap.selected .card {
    border-color: #6b6b6b;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, .08), 0 20px 48px rgba(0, 0, 0, .45);
  }

  /* 波形区（内嵌深槽） */
  .wave {
    height: 150px;
    background: var(--well);
    border: 1px solid rgba(255, 255, 255, .045);
    border-radius: 12px; /* 真实 audioWaveBox 为 12px */
    padding: 14px;
    box-shadow: inset 0 1px 4px rgba(0, 0, 0, .35);
    overflow: hidden;
    cursor: pointer;
    touch-action: none;
  }
  .wave-inner { position: relative; height: 100%; }
  .bars {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .bar {
    width: 2px;
    border-radius: 1px;
    background: #9db2a3;
    flex: none;
  }
  .playhead {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 2px;
    border-radius: 1px;
    background: var(--playhead);
    box-shadow: 0 0 6px rgba(240, 67, 74, .45);
    pointer-events: none;
  }

  /* 控制行 */
  .controls {
    margin-top: 16px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
  }
  .time {
    justify-self: start;
    font-size: 15px;
    font-weight: 500;
    color: #e8e8e8;
    letter-spacing: .01em;
  }
  .play {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: #2e2e2e;
    border: 1px solid rgba(255, 255, 255, .08);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .12s, transform .12s;
  }
  .play:hover { background: #3a3a3a; }
  .play:active { transform: scale(.94); }
  .play svg { width: 16px; height: 16px; }
</style>
</head>
<body>
<div class="hint">点击卡片选中出现工具条；点击空白取消</div>

<div class="stage">
  <div class="wrap" id="wrap">
    <!-- 悬浮工具条：截取 / 调速 / 混合 / 音视频合成 / 转码 | 下载 -->
    <div class="toolbar" id="toolbar">
      <button class="tb disabled" aria-disabled="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><path d="M8.12 8.12 12 12"/><path d="M20 4 8.12 15.88"/><circle cx="6" cy="18" r="3"/><path d="M14.8 14.8 20 20"/></svg>
        截取
        <span class="tip">即将上线</span>
      </button>
      <button class="tb disabled" aria-disabled="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/></svg>
        调速
        <span class="tip">即将上线</span>
      </button>
      <button class="tb disabled" aria-disabled="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/></svg>
        混合
        <span class="tip">即将上线</span>
      </button>
      <button class="tb disabled" aria-disabled="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.2 6 3 11l-.9-2.4c-.3-1.1.3-2.2 1.3-2.5l13.5-4c1.1-.3 2.2.3 2.5 1.3Z"/><path d="m6.2 5.3 3.1 3.9"/><path d="m12.4 3.4 3.1 4"/><path d="M3 11h18v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>
        音视频合成
        <span class="tip">即将上线</span>
      </button>
      <button class="tb disabled" aria-disabled="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>
        转码
        <span class="tip">即将上线</span>
      </button>
      <span class="sep"></span>
      <button class="tb" id="btnDownload">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
        下载
      </button>
    </div>

    <!-- 卡外标题行 -->
    <div class="meta">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 10v3"/><path d="M6 6v11"/><path d="M10 3v18"/><path d="M14 8v7"/><path d="M18 5v13"/><path d="M22 10v3"/></svg>
      <span class="name">海浪环境音.mp3</span>
      <span class="dur num">00:15</span>
    </div>

    <!-- 音频成品卡 -->
    <div class="card" id="card">
      <div class="wave" id="wave">
        <div class="wave-inner" id="waveInner">
          <div class="bars" id="bars"></div>
          <div class="playhead" id="playhead"></div>
        </div>
      </div>
      <div class="controls">
        <div class="time num" id="time">00:00 / 00:15</div>
        <button class="play" id="btnPlay" aria-label="播放">
          <svg id="icoPlay" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"/></svg>
          <svg id="icoPause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="14" y="4" width="4" height="16" rx="1"/><rect x="4" y="4" width="4" height="16" rx="1"/></svg>
        </button>
        <div></div>
      </div>
    </div>
  </div>
</div>

<script>
/* ================= 波形：伪随机生成，固定种子保证每次打开一致 ================= */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const N = 72;               // 细密竖条数量
const rand = mulberry32(7);
const barsEl = document.getElementById('bars');
for (let i = 0; i < N; i++) {
  const x = i / (N - 1);
  // 全局包络：中间高两端低；叠加两个慢正弦制造自然群组感
  const env = Math.pow(Math.sin(Math.PI * x), 0.65);
  const wave = 0.55 + 0.45 * Math.sin(x * Math.PI * 5.2 + 1.3) * Math.sin(x * Math.PI * 2.3 + 0.5);
  const v = env * (0.35 + 0.65 * wave) * (0.45 + 0.55 * rand());
  const h = Math.max(5, Math.round(8 + v * 108));
  const bar = document.createElement('div');
  bar.className = 'bar';
  bar.style.height = h + 'px';
  barsEl.appendChild(bar);
}

/* ================= 选中 / 取消 ================= */
const wrap = document.getElementById('wrap');
document.getElementById('card').addEventListener('click', () => wrap.classList.add('selected'));
document.addEventListener('click', e => {
  if (!e.target.closest('.wrap')) wrap.classList.remove('selected');
});

/* ================= 模拟播放（无真实音频） ================= */
const DURATION = 15;
let current = 0, playing = false, raf = null, lastTs = 0;

const timeEl = document.getElementById('time');
const playhead = document.getElementById('playhead');
const btnPlay = document.getElementById('btnPlay');
const icoPlay = document.getElementById('icoPlay');
const icoPause = document.getElementById('icoPause');

function fmt(t) {
  const s = Math.floor(t);
  return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}
function render() {
  timeEl.textContent = fmt(current) + ' / ' + fmt(DURATION);
  playhead.style.left = (current / DURATION * 100) + '%';
}
function setPlaying(p) {
  playing = p;
  icoPlay.style.display = p ? 'none' : '';
  icoPause.style.display = p ? '' : 'none';
  btnPlay.setAttribute('aria-label', p ? '暂停' : '播放');
  if (p) { lastTs = performance.now(); raf = requestAnimationFrame(tick); }
  else if (raf) { cancelAnimationFrame(raf); raf = null; }
}
function tick(ts) {
  if (!playing) return;
  current += (ts - lastTs) / 1000;
  lastTs = ts;
  if (current >= DURATION) { current = 0; render(); setPlaying(false); return; }
  render();
  raf = requestAnimationFrame(tick);
}
btnPlay.addEventListener('click', () => setPlaying(!playing));

/* ================= 波形 seek（点击 / 拖拽，整个波形区含边缘都可点） ================= */
const wave = document.getElementById('wave');
const waveInner = document.getElementById('waveInner');
let seeking = false;
function seekFromEvent(e) {
  const r = waveInner.getBoundingClientRect();
  const x = Math.min(Math.max(e.clientX - r.left, 0), r.width);
  current = x / r.width * DURATION;
  render();
}
wave.addEventListener('pointerdown', e => {
  seeking = true;
  wave.setPointerCapture(e.pointerId);
  seekFromEvent(e);
});
wave.addEventListener('pointermove', e => { if (seeking) seekFromEvent(e); });
wave.addEventListener('pointerup', () => { seeking = false; });

/* ================= 下载：演示反馈（按钮短暂变绿） ================= */
document.getElementById('btnDownload').addEventListener('click', function () {
  this.classList.remove('flash');
  void this.offsetWidth;
  this.classList.add('flash');
});
</script>
</body>
</html>
