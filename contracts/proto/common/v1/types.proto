syntax = "proto3";

// 跨进程共享的基础类型。
//
// ⚠️ 单位约定（全仓零浮点，见《计费逻辑详细设计》§1）：
//   - 所有金额用 int64，单位 **整数积分**（账本单位）。
//     mc（1 积分 = 1000 mc）只存在于计价管线**内部**的中间量与单价，
//     出口一次性四舍五入成积分后写账本——线上的金额字段不会是 mc。
//   - 所有系数用 int32，单位 **万分比**（bp），9000 = 90%
//   - 时间统一用 RFC3339 字符串（带时区），不用 unix 秒——避免时区歧义
package common.v1;

option java_package = "com.bluewhale.contracts.common.v1";
option java_multiple_files = true;

// 规格属性：键值均为**已规范化**的字符串（trim + lowercase，见《计费逻辑详细设计》§4.5.1）。
// 例：{"size": "2k"} · {"duration": "5", "resolution": "1080p"}
message SpecAttrs {
  map<string, string> attrs = 1;
}

// 分页请求（**offset 口径**）。
//
// ⚠️ 2026-09-30 由游标改为 offset。此前这里写的是「**不用 offset**——账本与流水持续新增，
//    offset 分页会漏数据」。**那条理由仍然成立**，不是被证伪了：一边翻页一边进新行时，
//    第 2 页确实可能漏掉（或重复）一行。改的原因是产品要列表出现「共 N 条」与页码，
//    而游标给不出总数；在「一套分页词汇」与「账本不漏行」之间选了前者，代价被接受。
//    依据与留痕见《通用积分卡「账户积分与订单」页前端对接文档》§6.2。
//
// ⚠️ 字段号 2 **保持 string**：曾打算把它原地换成 int32 的页码，那是同一字段号上的
//    类型变更 —— 滚动发布期间 billing 与 backend 新旧并存，老的一侧会把它解成错误的页号。
//    页码另开了字段号 3（`page`）。
// ⚠️ 旧字段**保留不删**（2026-09-30）：契约的硬规则是「字段只加不删」，`buf breaking`
//    在 PR 门禁里对着 release 基线拦这一类改动，且没有跳过开关。原先试过「删掉 + reserve」，
//    被门禁拦下 —— reserve 只是防字段号复用，不是「允许删」。
//    所以 `page_token` 留着标 `deprecated`：服务端不再读它，旧调用方发了也只是被忽略。
message PageRequest {
  int32 page_size = 1; // 上限由服务端钳制
  // 已废弃（原游标）。**不要再用**：服务端已不读它，发过来只会被忽略，
  // 表现为「永远停在第 1 页」—— 不报错，所以别指望它自己会响。
  string page_token = 2 [deprecated = true];
  int32 page = 3;      // 页码，从 1 起；< 1 按 1 处理
}

// 分页响应。
//
// ⚠️ `total` 是 `optional`：proto3 的 presence 让「未设置」与「0」可分辨。
//    两端都填（用户面与运营面，2026-09-30 改判 —— 「有页码、没总数」是前端翻页组件
//    表达不了的形状）。若用 0 当哨兵，「真的一行都没有」与「这个调用点还没实现」会一模一样。
message PageResponse {
  // 已废弃（原游标）。服务端不再填它，**恒为空串** —— 旧调用方读到空串会以为「没有下一页」，
  // 这是换 offset 的既定代价，见前端对接文档 §6.2。
  string next_page_token = 1 [deprecated = true];
  optional int64 total = 2; // 满足该查询条件的总条数；未设置 = 未统计
}
