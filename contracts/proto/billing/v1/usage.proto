syntax = "proto3";

// 用量上报：worker-java → billing-svc（**经 MQ，不是 RPC**）。
//
// ⚠️ worker **只上报原始量，不上报积分** —— 价格是 billing 的事，
//    worker 不该知道价格（见《架构设计》§8.1 阶段 2）。
package billing.v1;

import "common/v1/types.proto";

option java_package = "com.bluewhale.contracts.billing.v1";
option java_multiple_files = true;

message UsageLine {
  string model_id  = 1;
  string task_type = 2;

  // ★ 用量维度。**key 与 catalog 的 baseUnit / dims / multipliers 使用同一套封闭枚举**：
  //
  //      constant:1             按次
  //      usage.succeededSlots   成功的输出槽数（图片多张 / 视频多段）
  //      usage.seconds          时长（秒）
  //      usage.characters       字符数（TTS）
  //      usage.p / usage.c      输入 / 输出 token（文本，**本期不启用**）
  //      usage.cr / usage.cc5m / usage.cc1h  缓存读 / 缓存写 5m / 1h（**本期不启用**）
  //      usage.reasoning        思考 token（**本期不启用**）
  //      usage.imgIn / usage.imgOut / usage.audioIn / usage.audioOut  多模态（**本期不启用**）
  //      usage.referenceCount   参考素材数
  //      usage.len              总输入长度（**仅供 tiers 条件用**）
  //
  // 三方（catalog 配置 / 本契约 / QuantityRegistry）**必须一致**——
  // 这是「配了某个维度但没人上报」的结构性防线。
  map<string, int64> quantities = 3;

  common.v1.SpecAttrs specs = 4;

  // ★ 对账桥。**没有它，上游账单和用户明细永远对不上。**
  string upstream_request_id   = 5;
  int64  upstream_cost_credits = 6; // mc，上游实际收我们的（毛利分析）

  UsageSource usage_source = 7;
}

enum UsageSource {
  USAGE_SOURCE_UNSPECIFIED = 0;
  // 上游返回的 usage —— **权威**，结算用这个。
  USAGE_SOURCE_UPSTREAM  = 1;
  // 自己估算（上游不返回 usage 时）—— **结算时告警**，且占比 > 5% 触发 P2。
  // 绝不"假装准确"（《计费逻辑详细设计》§4.5 计费准确四规则）。
  USAGE_SOURCE_ESTIMATED = 2;
}
