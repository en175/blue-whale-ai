name: blue-whale-typescript-baseline

x-node-service: &node-service
  build:
    context: ../..
    dockerfile: Dockerfile.typescript-baseline
  image: blue-whale-typescript-baseline:acceptance
  environment: &node-environment
    MYSQL_HOST: mysql
    MYSQL_PORT: "3306"
    MYSQL_DATABASE: blue_whale
    MYSQL_USER: root
    MYSQL_PASSWORD: blue_whale
    GENERATION_CREDENTIAL_SECRET: acceptance-generation-secret
  depends_on:
    mysql:
      condition: service_healthy

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: blue_whale
      MYSQL_ROOT_PASSWORD: blue_whale
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - baseline-mysql-data:/var/lib/mysql
      - ../../packages/persistence/schema/001_baseline.sql:/docker-entrypoint-initdb.d/001_baseline.sql:ro
      - ../../packages/persistence/schema/002_seed.sql:/docker-entrypoint-initdb.d/002_seed.sql:ro
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-uroot",
          "-pblue_whale",
        ]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 10s

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  product-api:
    <<: *node-service
    command: ["node", "apps/product-api/dist/index.js"]
    environment:
      <<: *node-environment
      PORT: "4000"
    ports:
      - "4310:4000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 30

  agent-worker:
    <<: *node-service
    command: ["node", "apps/agent-worker/dist/index.js"]
    environment:
      <<: *node-environment
      PORT: "4001"
      AGENT_RUNTIME_MODE: fake
      DATABASE_URL: mysql://root:blue_whale@mysql:3306/blue_whale
    ports:
      - "4311:4001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4001/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 30

  generation-worker:
    <<: *node-service
    command: ["pnpm", "--filter", "blue_whale", "start:worker"]
    environment:
      <<: *node-environment
      DATABASE_URL: mysql://root:blue_whale@mysql:3306/blue_whale
      GENERATION_WORKER_PORT: "4002"
      NEW_API_BASE_URL: http://new-api.invalid
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      VOLC_ACCESS_KEY_ID: acceptance-placeholder
      VOLC_SECRET_ACCESS_KEY: acceptance-placeholder
      VOLC_TOS_ENDPOINT: tos.invalid
      VOLC_TOS_BUCKET: acceptance-placeholder
      VOLC_TOS_REGION: cn-beijing
    ports:
      - "4312:4002"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4002/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 30

  web:
    <<: *node-service
    command: ["pnpm", "--filter", "blue_whale", "start:lan"]
    environment:
      <<: *node-environment
      PORT: "3000"
      DATABASE_URL: mysql://root:blue_whale@mysql:3306/blue_whale
      GATEWAY_URL: http://product-api:4000
      GIT_COMMIT: ${GIT_COMMIT:-baseline}
      BUILD_TIME: ${BUILD_TIME:-baseline}
    ports:
      - "3101:3000"
    depends_on:
      product-api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/build-info').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  baseline-mysql-data:
