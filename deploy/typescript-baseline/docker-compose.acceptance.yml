name: blue-whale-typescript-baseline

x-node-service: &node-service
  build:
    context: ../..
    dockerfile: Dockerfile.typescript-baseline
  image: blue-whale-typescript-baseline:acceptance
  environment: &node-environment
    MYSQL_HOST: mysql
    MYSQL_PORT: "3306"
    MYSQL_DATABASE: blue_whale
    MYSQL_USER: root
    MYSQL_PASSWORD: blue_whale
    GENERATION_CREDENTIAL_SECRET: acceptance-generation-secret
  depends_on:
    mysql:
      condition: service_healthy

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: blue_whale
      MYSQL_ROOT_PASSWORD: blue_whale
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - baseline-mysql-data:/var/lib/mysql
      - ./init/000_create_new_api_database.sql:/docker-entrypoint-initdb.d/000_create_new_api_database.sql:ro
      - ../../packages/persistence/schema/001_baseline.sql:/docker-entrypoint-initdb.d/001_baseline.sql:ro
      - ../../packages/persistence/schema/002_seed.sql:/docker-entrypoint-initdb.d/002_seed.sql:ro
      - ./init/003_acceptance_agent_skill.sql:/docker-entrypoint-initdb.d/003_acceptance_agent_skill.sql:ro
      - ./init/004_acceptance_skill_journey.sql:/docker-entrypoint-initdb.d/004_acceptance_skill_journey.sql:ro
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-uroot",
          "-pblue_whale",
        ]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 10s

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  new-api:
    image: node:22-alpine
    command: ["/usr/local/bin/new-api"]
    volumes:
      - ${BW_NEW_API_BINARY:-/tmp/blue-whale-new-api-acceptance}:/usr/local/bin/new-api:ro
    environment:
      PORT: "3000"
      SQL_DSN: root:blue_whale@tcp(mysql:3306)/new_api?charset=utf8mb4&parseTime=True&loc=Local
      REDIS_CONN_STRING: redis://redis:6379/1
      SESSION_SECRET: acceptance-new-api-session-secret
      GENERATE_DEFAULT_TOKEN: "true"
      # 验收拓扑多场景连续注册，放宽限流（CRITICAL 默认 20 次/20 分钟会 429；GLOBAL 默认 360 次/180s）
      CRITICAL_RATE_LIMIT: "100000"
      GLOBAL_API_RATE_LIMIT: "100000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--spider",
          "http://127.0.0.1:3000/api/status",
        ]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 10s

  provider-stub:
    image: node:22-alpine
    command: ["node", "/app/tests/typescript-baseline/provider-stub.mjs"]
    volumes:
      - ../../:/app:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4329/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 30

  storage-stub:
    image: node:22-alpine
    command: ["node", "/app/tests/typescript-baseline/storage-stub.mjs"]
    volumes:
      - ../../:/app:ro
    environment:
      PORT: "4330"
      ASSET_UPLOAD_SECRET: acceptance-storage-secret
    ports:
      - "4330:4330"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4330/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 30

  agent-worker:
    <<: *node-service
    command: ["node", "apps/agent-worker/dist/index.js"]
    environment:
      <<: *node-environment
      PORT: "4001"
      MACHINE_ID: "2"
      AGENT_RUNTIME_MODE: fake
      AGENT_LEASE_MS: "8000"
      DATABASE_URL: mysql://root:blue_whale@mysql:3306/blue_whale
    ports:
      - "4311:4001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4001/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 30

  generation-worker:
    <<: *node-service
    command: ["pnpm", "--filter", "blue_whale", "start:worker"]
    environment:
      <<: *node-environment
      DATABASE_URL: mysql://root:blue_whale@mysql:3306/blue_whale
      MACHINE_ID: "3"
      GENERATION_WORKER_PORT: "4002"
      GENERATION_RECOVERY_INTERVAL_MS: "5000"
      NEW_API_BASE_URL: http://new-api:3000
      GENERATION_MEDIA_RELAY_MODE: passthrough
      NODE_ENV: test
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      VOLC_ACCESS_KEY_ID: acceptance-placeholder
      VOLC_SECRET_ACCESS_KEY: acceptance-placeholder
      VOLC_TOS_ENDPOINT: tos.invalid
      VOLC_TOS_BUCKET: acceptance-placeholder
      VOLC_TOS_REGION: cn-beijing
    ports:
      - "4312:4002"
    depends_on:
      mysql:
        condition: service_healthy
      new-api:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4002/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 30

  web:
    <<: *node-service
    command: ["pnpm", "--filter", "blue_whale", "start:lan"]
    environment:
      <<: *node-environment
      PORT: "3000"
      MACHINE_ID: "1"
      DATABASE_URL: mysql://root:blue_whale@mysql:3306/blue_whale
      NEW_API_BASE_URL: http://new-api:3000
      IMAGE_RECOVERY_INTERVAL_MS: "5000"
      IMAGE_JOB_LEASE_SECONDS: "15"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      GIT_COMMIT: ${GIT_COMMIT:-baseline}
      BUILD_TIME: ${BUILD_TIME:-baseline}
      VOLC_ACCESS_KEY_ID: ""
      VOLC_SECRET_ACCESS_KEY: ""
      VOLC_TOS_ENDPOINT: ""
      VOLC_TOS_BUCKET: ""
      VOLC_TOS_REGION: ""
      # S3 兼容直传（storage-stub）：publicBase 供宿主机浏览器 PUT/GET，internalBase 供容器内 HEAD/读取。
      ASSET_UPLOAD_PUBLIC_BASE: http://localhost:4330
      ASSET_UPLOAD_INTERNAL_BASE: http://storage-stub:4330
      ASSET_UPLOAD_SECRET: acceptance-storage-secret
    ports:
      - "3101:3000"
    depends_on:
      mysql:
        condition: service_healthy
      new-api:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage-stub:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/build-info').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  baseline-mysql-data:
