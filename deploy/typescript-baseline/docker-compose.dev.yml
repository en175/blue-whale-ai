# 日常开发端口发布层（与 docker-compose.acceptance.yml 叠加使用）
#
# 用途：宿主机上的 pnpm dev 需要直连本地 MySQL / new-api（账户服务），
# 验收 compose 默认只在容器内网暴露这些服务，本层把端口发布到宿主机。
# 数据隔离靠 compose 项目名（scripts/dev-stack.sh 使用 -p bw-ts-dev）：
# named volume 按项目名前缀生成，与验收栈 / pnpm db:fresh 互不干扰。
#
# 入口：scripts/dev-stack.sh up | down | fresh | status（不要手工 docker compose）
services:
  mysql:
    ports:
      - "3306:3306"

  redis:
    ports:
      - "6379:6379"

  new-api:
    ports:
      - "3001:3000"
