# Blue-Whale MVP 全栈验收 override（IK1NS2）
#
# 与基座合并使用（不单独启动）：
#   docker compose -p bw-mvp-acceptance \
#     -f deploy/local/docker-compose.yml \
#     -f deploy/local/docker-compose.acceptance.yml up -d --build
#
# 与开发者 blue-whale-local 栈完全隔离：
#   - 容器名 bw-acc-*（基座硬编码 bw-*，两套栈可同时运行）
#   - 镜像 tag :acceptance（验收 --build 不覆盖开发栈正在使用的 :local 镜像）
#   - 仅 web:3100 / gateway:8786 发布宿主端口；基础设施（MySQL/Redis/Nacos/User/Agent）
#     不发布宿主端口，顺带消除 nacos 9848/9849 硬编码端口冲突
#   - 项目名 bw-mvp-acceptance → 网络与数据卷按项目隔离；down -v 只清自己的资源
#   - environment 逐项钉死非生产占位值：即使开发者 deploy/local/.env 存在，
#     验收栈也恒定使用 Fake Provider、测试 ContentReview 与占位凭据，
#     真实供应商凭据不会进入验收容器（OPENAI/TOS 槽位显式置空）。
#
# 单一入口是 scripts/run-mvp-acceptance.sh；本文件一般不需要手动使用。

services:
  mysql:
    container_name: bw-acc-mysql
    environment:
      MYSQL_DATABASE: blue_whale
      MYSQL_ROOT_PASSWORD: blue_whale
    ports: !reset []

  redis:
    container_name: bw-acc-redis
    ports: !reset []

  nacos:
    container_name: bw-acc-nacos
    ports: !reset []

  # IK1W1E：Schema 迁移容器，复用 agent:acceptance 镜像，钉死密码与基座一致
  blue-whale-schema-migration:
    image: blue-whale-agent:acceptance
    container_name: bw-acc-schema-migration
    environment:
      MYSQL_DB: blue_whale
      MYSQL_PASSWORD: blue_whale

  blue-whale-gateway:
    image: blue-whale-gateway:acceptance
    container_name: bw-acc-gateway
    environment:
      JWT_SECRET: blue-whale-dev-secret-key-at-least-256-bits!!
    ports: !override
      - "8786:8686"

  blue-whale-user:
    image: blue-whale-user:acceptance
    container_name: bw-acc-user
    environment:
      MYSQL_DB: blue_whale
      MYSQL_PASSWORD: blue_whale
      JWT_SECRET: blue-whale-dev-secret-key-at-least-256-bits!!
    ports: !reset []

  blue-whale-agent:
    image: blue-whale-agent:acceptance
    container_name: bw-acc-agent
    environment:
      MYSQL_DB: blue_whale
      MYSQL_PASSWORD: blue_whale
      GENERATION_MODE: fake
      GENERATION_FAKE_ALLOWED: "true"
      GENERATION_ACCEPTANCE_ALLOWED: "false"
      OPENAI_API_KEY: ""
      OPENAI_BASE_URL: ""
      GENERATION_TOS_ACCESS_KEY: ""
      GENERATION_TOS_SECRET_KEY: ""
      GENERATION_TOS_REGION: ""
      GENERATION_TOS_ENDPOINT: ""
      GENERATION_TOS_BUCKET: ""
      SEEDANCE_CALLBACK_BASE_URL: ""
      # 验收栈没有激活 BundleVersion 种子（V10 只建表不播种）：关闭运行钉版强制，
      # 与 application-test.yml（enforcement-enabled: false）一致，否则对话接纳 404
      RUNTIME_BUNDLE_ENFORCEMENT_ENABLED: "false"
      # 浏览器经 web(3100) 访问 API 时 Origin 为 localhost:3100，需显式放行（默认仅 3000）
      AGENT_CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:3100"
    ports: !reset []

  blue-whale-agent-worker:
    image: blue-whale-agent-worker:acceptance
    container_name: bw-acc-agent-worker

  blue-whale-web:
    image: blue-whale-web:acceptance
    container_name: bw-acc-web
    ports: !override
      - "3100:3000"
