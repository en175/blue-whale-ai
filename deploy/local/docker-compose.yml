# Blue-Whale 本地 MVP 全栈（IK1NRX）
#
# 单一启动入口拉起 8 个服务：Web、Gateway、User Service、Agent Service、
# Python Agent Worker、MySQL、Redis、Nacos。默认走 Fake 编排、Fake 图片生成、
# 测试 ContentReview 与本地非生产存储/审计适配；所有公开请求仍经 Gateway。
#
# 启动：scripts/local-mvp.sh up
# 停止：scripts/local-mvp.sh down
# 健康：scripts/local-mvp.sh health
# 重置：scripts/local-mvp.sh init  （down -v 清库后重建）
#
# 所有可配置项见 .env.example；拷贝为 .env 后按需修改。

name: blue-whale-local

services:
  # ===== 基础设施 =====
  mysql:
    image: mysql:8.0
    container_name: bw-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DB:-blue_whale}
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-blue_whale}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    ports:
      - "${MYSQL_PUBLISH_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # IK1W1E：不再挂载 init SQL 到 docker-entrypoint-initdb.d。
      # MySQL 原生 entrypoint 只在空卷首次启动执行 init SQL，已有命名卷不会升级（漂移根因）。
      # Schema 初始化与版本化升级改由 blue-whale-schema-migration 容器统一接管。
    healthcheck:
      # MySQL 本身不再跑 ~470KB 的 init SQL，健康检查只需覆盖 mysqld 启动（数秒）。
      # 180s start_period 留足余量；实际首次启动通常 10-20s。
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_PASSWORD:-blue_whale}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  redis:
    image: redis:7-alpine
    container_name: bw-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PUBLISH_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nacos:
    # 与 spring-cloud-alibaba 2021.0.4.0 兼容（client 2.2.1 ↔ server 2.4.3，同属 2.x gRPC 协议，向下兼容）。
    # standalone 模式走内嵌 Derby，无需外置 MySQL。
    # nacos/nacos-server 自 v2.4.0 起官方提供 linux/arm64 manifest，
    # Apple Silicon 原生运行，无需 QEMU 仿真（v2.2.3 仅 amd64，仿真跑 JDK 1.8 启动需 10+ 分钟）。
    image: nacos/nacos-server:v2.4.3
    container_name: bw-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      JVM_XMS: 256m
      JVM_XMX: 512m
      JVM_XMN: 128m
    ports:
      - "${NACOS_PUBLISH_PORT:-8848}:8848"
      - "9848:9848"   # gRPC 端口（Nacos 2.x 客户端需要）
      - "9849:9849"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:8848/nacos/v1/console/health/readiness || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

  # ===== Schema 迁移（IK1W1E）=====
  # 单一权威迁移入口：等 MySQL 健康后按版本顺序执行 db/migrations/V*__*.sql，
  # 在 schema_migrations 记账本持久记录版本与状态。迁移成功 exit 0，失败 exit 非 0。
  # 下游 user/agent 用 depends_on: service_completed_successfully 等待迁移成功完成；
  # 迁移失败则 user/agent 根本不启动，实现 fail-closed 门禁。
  # 复用 agent 镜像（迁移器在 agent jar 内），用 migration-only profile 跑完即退出，
  # 不启动 web 服务、不注册 Nacos。Redis 仅因 agent 上下文 redisson 装配需要可达，
  # 迁移逻辑本身只用 MySQL JDBC。
  blue-whale-schema-migration:
    image: blue-whale-agent:local
    container_name: bw-schema-migration
    restart: "no"
    environment:
      SPRING_PROFILES_ACTIVE: migration-only
      BLUE_WHALE_SCHEMA_MIGRATION_ENABLED: "true"
      # 关闭 Nacos 注册（迁移是临时任务，不注册到发现中心）
      SPRING_CLOUD_NACOS_DISCOVERY_ENABLED: "false"
      SPRING_CLOUD_NACOS_DISCOVERY_REGISTER_ENABLED: "false"
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_NAMESPACE: ""
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DB: ${MYSQL_DB:-blue_whale}
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-blue_whale}
      # Redis 凭据：agent 上下文启动时 redisson bean 会装配并探测 Redis，
      # 迁移逻辑本身不用 Redis，但让连接可达避免上下文启动噪音。
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      JAVA_TOOL_OPTIONS: "-Xmx256m"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ===== 业务服务（build context 统一在 blue_whale_server/） =====
  blue-whale-gateway:
    build:
      context: ../../blue_whale_server
      dockerfile: blue-whale-gateway/Dockerfile
      args:
        # IK1W1E：构建身份注入，由 local-mvp.sh / run-mvp-acceptance.sh export
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    image: blue-whale-gateway:local
    container_name: bw-gateway
    restart: unless-stopped
    environment:
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_NAMESPACE: ""
      JWT_SECRET: ${JWT_SECRET:-blue-whale-dev-secret-key-at-least-256-bits!!}
      JAVA_TOOL_OPTIONS: "-Xmx256m"
    ports:
      - "${GATEWAY_PUBLISH_PORT:-8686}:8686"
    depends_on:
      nacos:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:8686/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  blue-whale-user:
    build:
      context: ../../blue_whale_server
      dockerfile: blue-whale-user/blue-whale-user-service/Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    image: blue-whale-user:local
    container_name: bw-user
    restart: unless-stopped
    environment:
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_NAMESPACE: ""
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DB: ${MYSQL_DB:-blue_whale}
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-blue_whale}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      JWT_SECRET: ${JWT_SECRET:-blue-whale-dev-secret-key-at-least-256-bits!!}
      SMS_PROVIDER: console
      JAVA_TOOL_OPTIONS: "-Xmx384m"
    ports:
      - "${USER_PUBLISH_PORT:-8081}:8081"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      # IK1W1E：等 Schema 迁移成功完成才启动，迁移失败则 user 不启动（fail-closed 门禁）
      blue-whale-schema-migration:
        condition: service_completed_successfully
    healthcheck:
      # user-service 无专用 /health 端点；测 8081 端口可达。
      # Spring Security 对 / 返回 401/403（进程起来、Security 生效）；
      # 接受 2xx/3xx/4xx，排除 5xx（服务异常）和 000（连接失败）。
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/ | grep -qE '^(2|3|4)'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

  blue-whale-agent:
    build:
      context: ../../blue_whale_server
      dockerfile: blue-whale-agent/blue-whale-agent-service/Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    image: blue-whale-agent:local
    container_name: bw-agent
    restart: unless-stopped
    environment:
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_NAMESPACE: ""
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DB: ${MYSQL_DB:-blue_whale}
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-blue_whale}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      # 本地 Fake 图片生成（IK1NRZ）：确定性非生产适配，无需真实供应商/对象存储凭据；
      # Java 内嵌 Generation Worker 定时认领（GENERATION_WORKER_SCHEDULED 默认 true）
      # 受控真实图片验收（IK1NS3）：.env 显式覆盖 GENERATION_MODE=openai-tos +
      # GENERATION_ACCEPTANCE_ALLOWED=true 并注入真实凭据后启用，步骤见 acceptance/README.md；
      # 默认（.env 不覆盖）始终为 Fake，普通 CI 不会触发真实供应商调用
      GENERATION_MODE: ${GENERATION_MODE:-fake}
      GENERATION_FAKE_ALLOWED: ${GENERATION_FAKE_ALLOWED:-true}
      GENERATION_ACCEPTANCE_ALLOWED: ${GENERATION_ACCEPTANCE_ALLOWED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com}
      GENERATION_TOS_ACCESS_KEY: ${GENERATION_TOS_ACCESS_KEY:-}
      GENERATION_TOS_SECRET_KEY: ${GENERATION_TOS_SECRET_KEY:-}
      GENERATION_TOS_REGION: ${GENERATION_TOS_REGION:-}
      GENERATION_TOS_ENDPOINT: ${GENERATION_TOS_ENDPOINT:-}
      GENERATION_TOS_BUCKET: ${GENERATION_TOS_BUCKET:-}
      GENERATION_TOS_PREFIX: ${GENERATION_TOS_PREFIX:-generation-acceptance}
      SEEDANCE_CALLBACK_BASE_URL: ${SEEDANCE_CALLBACK_BASE_URL:-}
      AGENT_ORCHESTRATOR_ENGINE: fake
      JAVA_TOOL_OPTIONS: "-Xmx512m"
    ports:
      - "${AGENT_PUBLISH_PORT:-8082}:8082"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      # IK1W1E：等 Schema 迁移成功完成才启动，迁移失败则 agent 不启动（fail-closed 门禁）
      blue-whale-schema-migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:8082/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

  blue-whale-agent-worker:
    build:
      context: ../../blue_whale_agent_worker
      dockerfile: Dockerfile
    image: blue-whale-agent-worker:local
    container_name: bw-agent-worker
    restart: unless-stopped
    environment:
      BLUE_WHALE_AGENT_BASE_URL: http://blue-whale-agent:8082
      WORKER_ADAPTER: fake
      WORKER_ID: local-fake-worker
    # 通过循环脚本包装 run_once，不改 Python 业务代码
    entrypoint: ["/usr/local/bin/run-worker-loop.sh"]
    volumes:
      - ./scripts/run-worker-loop.sh:/usr/local/bin/run-worker-loop.sh:ro
    depends_on:
      blue-whale-agent:
        condition: service_healthy
    # worker 无 HTTP 端点，也无可靠的进程级健康探针（python:3.11-slim 无 pgrep）；
    # 健康判断由 healthcheck.sh 通过容器 running 状态 + restart: unless-stopped 兜底。
    # 真正的「是否在推进 AgentRun」看业务日志，不在 healthcheck 职责内。

  blue-whale-web:
    build:
      context: ../../blue_whale_web
      dockerfile: Dockerfile
    image: blue-whale-web:local
    container_name: bw-web
    restart: unless-stopped
    environment:
      GATEWAY_URL: http://blue-whale-gateway:8686
      NODE_ENV: production
    ports:
      - "${WEB_PUBLISH_PORT:-3000}:3000"
    depends_on:
      blue-whale-gateway:
        condition: service_healthy
    healthcheck:
      # Next.js standalone server 监听 3000；node:alpine 自带 wget
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  mysql-data:
  redis-data:
