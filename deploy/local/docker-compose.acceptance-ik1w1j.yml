# IK1W1J schema 验收专用 override（并行工单隔离）
#
# docker-compose.acceptance.yml 的容器名全部硬编码 bw-acc-*，多个并行工单
# 同时跑验收时全局互踩（同名冲突 + :acceptance 镜像 tag 互相覆盖）。
# 本文件用独立容器名 bw-j1j-* 与独立镜像 tag :acc-ik1w1j，
# 与兄弟工单（bw-acc-* / :acceptance）完全隔离，可并行跑。
# 复用方式：run-schema-acceptance.sh 检测本文件存在即替换 acceptance override
# 并预设 EXPECTED_IMAGE_SUFFIX 环境变量（构建用 :acc-ik1w1j）。

services:
  mysql:
    container_name: bw-j1j-mysql
    environment:
      MYSQL_DATABASE: blue_whale
      MYSQL_ROOT_PASSWORD: blue_whale
    ports: !reset []

  redis:
    container_name: bw-j1j-redis
    ports: !reset []

  nacos:
    container_name: bw-j1j-nacos
    # 基座把 9848/9849 gRPC 端口硬编码发布到宿主，并行栈冲突，全部重置
    ports: !reset []

  blue-whale-schema-migration:
    image: blue-whale-agent:acc-ik1w1j
    container_name: bw-j1j-schema-migration
    environment:
      MYSQL_DB: blue_whale
      MYSQL_PASSWORD: blue_whale

  blue-whale-gateway:
    image: blue-whale-gateway:acc-ik1w1j
    container_name: bw-j1j-gateway
    environment:
      JWT_SECRET: blue-whale-dev-secret-key-at-least-256-bits!!
    ports: !reset []

  blue-whale-user:
    image: blue-whale-user:acc-ik1w1j
    container_name: bw-j1j-user
    environment:
      MYSQL_DB: blue_whale
      MYSQL_PASSWORD: blue_whale
      JWT_SECRET: blue-whale-dev-secret-key-at-least-256-bits!!
    ports: !reset []

  blue-whale-agent:
    image: blue-whale-agent:acc-ik1w1j
    container_name: bw-j1j-agent
    environment:
      MYSQL_DB: blue_whale
      MYSQL_PASSWORD: blue_whale
      GENERATION_MODE: fake
      GENERATION_FAKE_ALLOWED: "true"
      GENERATION_ACCEPTANCE_ALLOWED: "false"
      OPENAI_API_KEY: ""
      OPENAI_BASE_URL: ""
      GENERATION_TOS_ACCESS_KEY: ""
      GENERATION_TOS_SECRET_KEY: ""
      GENERATION_TOS_REGION: ""
      GENERATION_TOS_ENDPOINT: ""
      GENERATION_TOS_BUCKET: ""
      SEEDANCE_CALLBACK_BASE_URL: ""
    ports: !reset []

  blue-whale-agent-worker:
    image: blue-whale-agent-worker:acc-ik1w1j
    container_name: bw-j1j-agent-worker

  blue-whale-web:
    image: blue-whale-web:acc-ik1w1j
    container_name: bw-j1j-web
    ports: !reset []
