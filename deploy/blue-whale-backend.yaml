apiVersion: apps/v1
kind: Deployment
metadata:
  name: blue-whale-backend
  namespace: default
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: blue-whale-backend
  template:
    metadata:
      labels:
        app: blue-whale-backend
    spec:
      terminationGracePeriodSeconds: 120
      imagePullSecrets:
      - name: ccr-secret
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - blue-whale-backend
              topologyKey: kubernetes.io/hostname
      containers:
      - name: blue-whale-backend
        image: "xf-bluewhale-cn-beijing.cr.volces.com/bluewhale/bluewhale-backend:$(tag)"
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3100
          protocol: TCP
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: blue-whale-secrets
              key: DATABASE_URL
        - name: REDIS_CONN_STRING
          valueFrom:
            secretKeyRef:
              name: blue-whale-secrets
              key: REDIS_CONN_STRING
        - name: ROCKETMQ_ENDPOINTS
          valueFrom:
            secretKeyRef:
              name: blue-whale-secrets
              key: ROCKETMQ_ENDPOINTS
        - name: ROCKETMQ_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: blue-whale-secrets
              key: ROCKETMQ_ACCESS_KEY
        - name: ROCKETMQ_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: blue-whale-secrets
              key: ROCKETMQ_SECRET_KEY
        - name: NEW_API_ROOT_ACCESS_TOKEN
          valueFrom:
            secretKeyRef:
              name: blue-whale-secrets
              key: NEW_API_ROOT_ACCESS_TOKEN
        - name: GENERATION_CREDENTIAL_SECRET
          valueFrom:
            secretKeyRef:
              name: blue-whale-secrets
              key: GENERATION_CREDENTIAL_SECRET
        - name: AGENT_SERVICE_TOKEN
          valueFrom:
            secretKeyRef:
              name: blue-whale-secrets
              key: AGENT_SERVICE_TOKEN
        - name: BLUE_WHALE_INTERNAL_SERVICE_TOKEN
          valueFrom:
            secretKeyRef:
              name: blue-whale-secrets
              key: BLUE_WHALE_INTERNAL_SERVICE_TOKEN
        - name: VOLC_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: blue-whale-secrets
              key: VOLC_ACCESS_KEY_ID
        - name: VOLC_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: blue-whale-secrets
              key: VOLC_SECRET_ACCESS_KEY
        - name: VOLC_TOS_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: blue-whale-secrets
              key: VOLC_TOS_ENDPOINT
        - name: VOLC_TOS_BUCKET
          valueFrom:
            secretKeyRef:
              name: blue-whale-secrets
              key: VOLC_TOS_BUCKET
        - name: VOLC_TOS_REGION
          valueFrom:
            secretKeyRef:
              name: blue-whale-secrets
              key: VOLC_TOS_REGION
        - name: TLS_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: blue-whale-secrets
              key: TLS_ENDPOINT
        - name: TLS_REGION
          valueFrom:
            secretKeyRef:
              name: blue-whale-secrets
              key: TLS_REGION
        - name: TLS_TOPIC_ID
          valueFrom:
            secretKeyRef:
              name: blue-whale-secrets
              key: TLS_TOPIC_ID
        - name: TLS_AK
          valueFrom:
            secretKeyRef:
              name: blue-whale-secrets
              key: TLS_AK
        - name: TLS_SK
          valueFrom:
            secretKeyRef:
              name: blue-whale-secrets
              key: TLS_SK
        - name: BLUE_WHALE_TOPUP_COLLECT_TOKEN
          valueFrom:
            secretKeyRef:
              name: blue-whale-secrets
              key: BLUE_WHALE_TOPUP_COLLECT_TOKEN
        - name: NEW_API_AGENT_BILLING_TOKEN
          valueFrom:
            secretKeyRef:
              name: blue-whale-secrets
              key: NEW_API_AGENT_BILLING_TOKEN
        - name: VOLC_SMS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: blue-whale-secrets
              key: VOLC_SMS_ACCESS_KEY_ID
        - name: VOLC_SMS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: blue-whale-secrets
              key: VOLC_SMS_SECRET_ACCESS_KEY
        - name: SYSTEM_SETTINGS_SECRET
          valueFrom:
            secretKeyRef:
              name: blue-whale-secrets
              key: SYSTEM_SETTINGS_SECRET
        - name: PORT
          value: "3100"
        - name: NEW_API_BASE_URL
          value: "https://yunjizi.cn"
        - name: AGENT_SERVICE_BASE_URL
          value: "http://blue-whale-agent-svc:4112"
        - name: BILLING_GRPC_URL
          value: "http://blue-whale-billing-svc:4004"
        - name: BILLING_ADMIN_URL
          value: "http://blue-whale-billing-svc:4003"
        - name: PAY_SERVER_BASE_URL
          value: "http://192.168.0.148:9216"
        - name: SMS_PROVIDER
          value: "volcengine"
        - name: VOLC_SMS_ACCOUNT
          value: "8c026cce"
        - name: VOLC_SMS_SIGN
          value: "杭州玄浮科技"
        - name: VOLC_SMS_TEMPLATE_ID
          value: "S1T_1y2pbbfa2t4oy"
        - name: AGENT_MODEL_DRAIN_TIMEOUT_MS
          value: "90000"
        readinessProbe:
          tcpSocket:
            port: 3100
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: "2"
            memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: blue-whale-backend-svc
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: blue-whale-backend
  ports:
  - name: http
    port: 3100
    targetPort: 3100
    protocol: TCP
