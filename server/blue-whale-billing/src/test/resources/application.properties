# 真库集成测试的连接串 —— **只能指向测试专用库**（库名 bw_billing_test*）。
#
# ⚠️ 为什么非得有这个文件：测试类原先继承 application.yml 的默认连接串，而那个默认值是
#    **开发库 bw_billing**。门控集成测试的 @BeforeEach 会 DELETE 清表，于是「跑一次测试」
#    等于「清一次本地开发数据」——2026-09 真实发生过两次（用户积分归零、定价目录换成测试夹具）。
#    这里给测试一个自己的落点：开发库的连接串在测试代码里根本不出现。
#
# 覆盖方式：BILLING_TEST_DB_URL=jdbc:mysql://<host>:<port>/bw_billing_test_xxx?...
#   库名必须匹配 bw_billing_test*，否则 BillingTestDatabaseGate 直接拒跑（跳过并打印改法）；
#   库不存在时门禁会自动建（只建库，schema 交给 Flyway）。
#
# ⚠️ 参数与 application.yml 逐项一致，尤其两个时区参数：DbTime.ZONE 靠它对齐，
#    否则「北京时间写、UTC 比」差 8 小时，表现是积分到期后还能多用 8 小时。
spring.datasource.url=${BILLING_TEST_DB_URL:jdbc:mysql://localhost:13306/bw_billing_test?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&connectionTimeZone=Asia/Shanghai&forceConnectionTimeZoneToSession=true}

# ── 对账的定时任务：把**首次执行推迟到 24 小时后**（等于「测试期间不跑」）──
#
# 为什么必须推迟：@EnableScheduling 在测试上下文里同样生效（这是有意的——cron /
# duration 字符串在上下文启动时就会被解析，写错了当场炸，而不是等到线上凌晨 3 点）。
# 但若让它们按默认的 1 分钟首跑，后台线程就会去动**共享的** bw_billing_test：
# 预留兜底会释放测试夹具里超时的 held 预留，于是「我造的那条超时预留」可能在我断言之前
# 就被后台释放掉，测试变成看运气。定时任务与测试共用一张库时，
# 唯一能保证确定性的做法就是让它在测试期间不触发。
#
# ⚠️ 测的是任务本身（ReservationSweeper / LedgerSelfCheck）：直接调它们的公开方法
#    （sweepOnce / check）——与 @Scheduled 入口走的是同一条代码路径，不是另写一套。
billing.reconciliation.sweeper.initial-delay=PT24H

