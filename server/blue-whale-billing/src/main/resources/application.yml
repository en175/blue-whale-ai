# billing-svc 配置（ADR-0113 / ADR-0114）
#
# 端口约定：worker=4002，billing=4003（同段 4xxx，容器内网）
server:
  port: ${BILLING_PORT:4003}

spring:
  application:
    name: billing-java          # ⚠️ 服务名，与目录名解耦。改它 = 改监控标识与未来的 MQ 消费组。
  threads:
    virtual:
      enabled: true             # Java 21 虚拟线程：计费是 I/O 密集（DB + gRPC），线程不是瓶颈

  # ── 自有库（ADR-0113 数据主权：每个服务数据私有，禁止跨服务直连） ──
  #
  # ⚠️ **凭据只走环境变量、不落任何入库文件**（对齐测试站连接串的治理口径）。
  #    本地开发从 docker 容器取：
  #      docker inspect bw-mysql --format '{{range .Config.Env}}{{println .}}{{end}}' | grep MYSQL_ROOT_PASSWORD
  #    然后 export BILLING_DB_PASSWORD=...
  #
  # ⚠️ **两个时区参数必须与 com.bluewhale.billing.domain.DbTime.ZONE 保持一致。**
  #    表里存的是无时区的 DATETIME，而批次是否过期又靠服务端的 NOW() 判定——
  #    NOW() 返回的是**会话时区**的墙钟。容器里 MySQL 默认 UTC，若会话时区不钉住，
  #    北京时间写进去、UTC 比出来，偏差整 8 小时，表现是「积分到期后还能多用 8 小时」。
  #    这种钱漏不会报错、也不会有人当场发现，所以宁可在连接串上显式钉死。
  #      · connectionTimeZone          驱动理解 DATETIME 时用的时区
  #      · forceConnectionTimeZoneToSession  连接建立时把会话 time_zone 也设成它
  #    只写 connectionTimeZone 不够：那只是驱动侧的换算，服务端 NOW() 仍用全局时区。
  datasource:
    url: ${BILLING_DB_URL:jdbc:mysql://localhost:13306/bw_billing?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&connectionTimeZone=Asia/Shanghai&forceConnectionTimeZoneToSession=true}
    username: ${BILLING_DB_USERNAME:root}
    password: ${BILLING_DB_PASSWORD:}

  # ── schema 权威在 billing 自己手里（Flyway），不走 backend 的 Prisma ──
  #    理由见 pom.xml 的注释：表若由 Prisma 管，「数据私有」就只剩口号。
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 生产禁止自动 clean；本地也别开——误清库的代价远大于省下的手动操作
    clean-disabled: true
    baseline-on-migrate: false

  # ── ORM：MyBatis-Plus（与 worker 同款同版本，ADR-0114 技术栈逐项对齐） ──
  #
  # SQL 的落位约定（全模块统一，避免同一服务里出现两种写 SQL 的姿势）：
  #
  #   写 XML（resources/mapper/）—— 带下列任一特征的语句：
  #     · ORDER BY / LIMIT      排序与截断的语义要在 SQL 里看得见
  #     · FOR UPDATE            锁语义必须显式
  #     · 聚合                  SUM(remaining - frozen) 这类表达式，Wrapper 的 select
  #                             只能列字段名
  #     · 自引用表达式          SET frozen = frozen + ?，Wrapper 的 set 只能赋常量
  #
  #   用 LambdaQueryWrapper —— 纯等值 / 比较谓词的单表读写与单行增删改：
  #     这类 SQL 是纯样板，写进 XML 只会多一处「改列名时要同步」的地方。
  #     字段名由方法引用推导（CreditLotEntity::getUserId），编译期即可校验，
  #     不会因为改名而静默查错列。
  #
  # 实体在 com.bluewhale.billing.domain.entity，对应 Flyway 迁移建的表——
  # schema 权威仍在 Flyway，实体只是映射，改字段先改迁移。
  mybatis-plus:
    mapper-locations: classpath*:mapper/**/*.xml
    configuration:
      # 下划线列 → 驼峰字段。开了这个，实体上就不必给每个字段挂 @TableField——
      # 那些注解与列名逐字重复，却不携带任何信息。
      map-underscore-to-camel-case: true

logging:
  level:
    com.bluewhale: INFO
    # 首次接入时想看 Flyway 实际跑了哪些迁移，临时调到 INFO 即可
    org.flywaydb: INFO
    # 排查「为什么这条查不到」时把下面这行放开，日志里会回显实际 SQL 与参数
    # com.bluewhale.billing.infrastructure.mapper: DEBUG

# ── gRPC（契约的 server 端；契约见 contracts/proto/billing/v1/billing.proto） ──
#
# ⚠️ **默认关闭**：开着会让每个 @SpringBootTest 都去绑真实端口，测试之间随机冲突，
#    而根因与测试内容毫无关系。这里显式打开，测试则需要时自行指定端口 0。
billing:
  grpc:
    enabled: true
    port: ${BILLING_GRPC_PORT:4004}

  # ── 管理端接口（/admin/**，发布定价目录、发放积分） ──
  #
  # ⚠️ **没有鉴权**。它与 gRPC 的差别在于：Hold 受用户余额约束，而管理端能**凭空生积分**。
  #    这个端口只在内网、只由运维与后台调用；管理端鉴权落地前**禁止对外暴露**。
  #    要临时关掉：BILLING_ADMIN_ENABLED=false。
  admin:
    enabled: ${BILLING_ADMIN_ENABLED:true}

  # ── MQ：结算 / 返还的消费端 ──
  # ⚠️ 缺 ROCKETMQ_ENDPOINTS 会**启动失败**（与 worker 同一立场）：静默跳过消费者的话，
  #    服务照常起来、Hold 照常工作，但任务跑完后没人结算也无人解冻，用户的钱一直冻着，
  #    而所有健康检查都是绿的 —— 这种「起来了一半」比起不来难查得多。
  #    本地只想验 Hold：BILLING_MQ_ENABLED=false。
  mq:
    enabled: ${BILLING_MQ_ENABLED:true}
    topic-completed: ${BILLING_MQ_TOPIC_COMPLETED:generation.job.completed}
    topic-failed: ${BILLING_MQ_TOPIC_FAILED:generation.job.failed}

  # ── 影子模式（《迁移与切换 runbook》§3.2） ──
  #
  # true  = 消费 job 事件时**只算不扣**，把结果写进 billing_shadow_entries 供每日对账
  # false = 权威生效：按预扣时冻结的版本与折扣结算，真的动钱
  #
  # ⚠️ **默认必须是 true。** 切换期的硬约束是「billing 上线与 sk- 断链同时发生」——
  #    在这个开关还是 false 的情况下先部署一次，就是每个任务被扣两遍
  #    （我们一遍、new-api 一遍）。等切换窗口执行完 runbook §3.3 的十一步，
  #    再把它显式设成 false。
  #
  # 判断当前处于哪一期的接口：GET /admin/shadow/summary（响应里回显 shadowMode）。
  shadow-mode: ${BILLING_SHADOW_MODE:true}

# gRPC proxy 端点。键名与 worker 逐字相同，部署时不必记两套；凭证只走 env（不落库）。
rocketmq:
  endpoints: ${ROCKETMQ_ENDPOINTS:}
  access-key: ${ROCKETMQ_ACCESS_KEY:}
  secret-key: ${ROCKETMQ_SECRET_KEY:}
  ssl-enabled: ${ROCKETMQ_SSL_ENABLED:false}

# ⚠️ MQ / 账本 / 账户尚未接入：按 ADR-0113 的 P2–P4 落地时按真实形状加。
