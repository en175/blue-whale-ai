server:
  port: ${GENERATION_WORKER_PORT:4002}

spring:
  application:
    name: worker-java
  task:
    scheduling:
      pool:
        size: 4

worker:
  concurrency:
    image: ${IMAGE_CONCURRENCY:20}
    audio: ${AUDIO_CONCURRENCY:5}
    media-extract: ${MEDIA_EXTRACT_CONCURRENCY:2}
    audio-trim: ${AUDIO_TRIM_CONCURRENCY:2}
    audio-speed: ${AUDIO_SPEED_CONCURRENCY:2}
    image-enhance: ${IMAGE_ENHANCE_CONCURRENCY:5}
    image-erase: ${IMAGE_ERASE_CONCURRENCY:5}
    image-cutout: ${IMAGE_CUTOUT_CONCURRENCY:5}
    image-outpaint: ${IMAGE_OUTPAINT_CONCURRENCY:5}
    video-subtitle-erase: ${VIDEO_SUBTITLE_ERASE_CONCURRENCY:5}
    video-enhance: ${VIDEO_ENHANCE_CONCURRENCY:5}
    vocal-split: ${VOCAL_SPLIT_CONCURRENCY:5}
    video-scene-split: ${VIDEO_SCENE_SPLIT_CONCURRENCY:5}
    video-matting: ${VIDEO_MATTING_CONCURRENCY:5}
    video-frame-interpolation: ${VIDEO_FRAME_INTERPOLATION_CONCURRENCY:5}

rocketmq:
  endpoints: ${ROCKETMQ_ENDPOINTS:}
  access-key: ${ROCKETMQ_ACCESS_KEY:}
  secret-key: ${ROCKETMQ_SECRET_KEY:}
  ssl-enabled: ${ROCKETMQ_SSL_ENABLED:false}

logging:
  level:
    root: info
