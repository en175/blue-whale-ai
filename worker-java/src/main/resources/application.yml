# 环境变量名与 TS worker 逐一对齐（ADR-0084 / 契约 §5）：同一个生成任务 topic 按 tag 区分任务类型，
# 消费侧 = worker-java 单栈（TS worker 已随刀④收口退役，不再有双栈共用 env 的灰度期）。
# topic / tag 不在此配置：它们是契约 §1 的冻结值，单处定义在 domain/entity/GenerationMqRoute.java，
# 故部署环境里残留的 ROCKETMQ_TOPIC / ROCKETMQ_TAG 不再有绑定目标（宽松绑定忽略未知属性，不报错也不生效）。
server:
  port: ${GENERATION_WORKER_PORT:4002}

spring:
  application:
    name: worker-java
  task:
    scheduling:
      pool:
        # 默认池大小是 1——两个 @Scheduled（RecoveryService / MaterialStatusPoller）会抢同一个线程。
        # 素材跟进一轮最多 100 次串行 GetAsset（单次 connect 10s / read 15s），网关一 hang 就能把
        # 唯一的调度线程占住几十分钟，而 fixedDelay 紧接着排下一轮 → recovery 会被饿死，
        # 表现为「不相干用户的卡死任务再也不被重投」。这里给每个任务留出独立线程。
        size: 4

worker:
  concurrency:
    image: ${IMAGE_CONCURRENCY:20}
    audio: ${AUDIO_CONCURRENCY:5}
    media-extract: ${MEDIA_EXTRACT_CONCURRENCY:2}
    image-enhance: ${IMAGE_ENHANCE_CONCURRENCY:5}
    image-erase: ${IMAGE_ERASE_CONCURRENCY:5}
    image-cutout: ${IMAGE_CUTOUT_CONCURRENCY:5}
    image-outpaint: ${IMAGE_OUTPAINT_CONCURRENCY:5}
    video-subtitle-erase: ${VIDEO_SUBTITLE_ERASE_CONCURRENCY:5}
    video-enhance: ${VIDEO_ENHANCE_CONCURRENCY:5}

rocketmq:
  # gRPC proxy 端点（与 TS 同组变量；凭证只走 env，禁止落库）
  endpoints: ${ROCKETMQ_ENDPOINTS:}
  access-key: ${ROCKETMQ_ACCESS_KEY:}
  secret-key: ${ROCKETMQ_SECRET_KEY:}
  ssl-enabled: ${ROCKETMQ_SSL_ENABLED:false}

logging:
  level:
    root: info
