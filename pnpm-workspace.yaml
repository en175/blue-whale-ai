packages:
  - "backend"

nodeVersion: 24.18.0
engineStrict: true

allowBuilds:
  '@prisma/engines': true
  esbuild: true
  msgpackr-extract: false
  protobufjs: true
  prisma: true
  sharp: true
  tos-crc64-js: false
  unrs-resolver: true
  ffmpeg-static: true

patchedDependencies:
  '@prisma/adapter-mariadb@7.9.0': backend/patches/@prisma__adapter-mariadb@7.9.0.patch
