packages:
  - "apps/*"
  - "packages/*"
  - "blue_whale_web"
  - "backend"

nodeVersion: 24.18.0
engineStrict: true

allowBuilds:
  '@prisma/engines': true
  esbuild: true
  msgpackr-extract: false
  protobufjs: true
  prisma: true
  sharp: true
  tos-crc64-js: false
  unrs-resolver: true

patchedDependencies:
  "@google/design.md@0.3.0": "blue_whale_web/patches/@google+design.md+0.3.0.patch"
